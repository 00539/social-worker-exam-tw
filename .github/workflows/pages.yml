name: Deploy to GitHub Pages

# app/ 是純靜態頁面，直接整包上傳，不需要建置步驟
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，但不中斷進行中的那個
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload app/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
